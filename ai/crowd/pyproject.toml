[project]
name = "scenecrew-crowd"
version = "0.1.0"
description = "고정 카메라 구역별 인원 추정(/internal/estimate-crowd, #360)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "pydantic>=2.12",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# 후보 비교·ONNX 변환에만 쓴다. 서빙 이미지에는 들어가지 않는다.
bench = [
    "onnx>=1.19",
    "torch==2.14.1",
    "torchvision",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
