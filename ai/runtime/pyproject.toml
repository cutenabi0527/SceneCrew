[project]
name = "ai-runtime"
version = "0.1.0"
description = "AI 서버 배포 이미지의 공통 실행 환경 (계획·대응안·STT·보고·문서 추출)"
requires-python = ">=3.12,<3.13"
# 각 모듈의 pyproject·lock은 그대로 두고, 같은 이미지에서 함께 쓰는 버전을 여기서 하나로 고정한다.
# 버전 출처: stt/uv.lock(faster-whisper·ctranslate2·av), report-api/uv.lock(fastapi·onnxruntime 등),
# report-v1-onnx-int8 conversion.json(torch 2.14.1+cpu·transformers 5.20.2·onnxruntime 1.31.1)
# OCR은 Linux x86-64 CPU 추출 프로세스에서 사용한다.
# pillow·pypdfium2: 계획 생성의 평면도 쪽 렌더링(plan/floor_plan.py, S15P31A202-298). 버전은 plan/uv.lock과 같다.
dependencies = [
    "av==19.0.1",
    "ctranslate2==4.8.3",
    "fastapi==0.162.0",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    # 대응안 Multi-agent 실행 구조(ai/change, #374). change/uv.lock과 같은 버전이다.
    "langgraph==1.2.20",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "paddleocr==3.4.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "paddlepaddle==3.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pypdf==6.21.4",
    "pypdfium2==5.15.2",
    "torch==2.14.1",
    "transformers==5.20.2",
    "uvicorn==0.54.0",
]

# PyPI의 Linux torch는 CUDA 라이브러리를 함께 받으므로 CPU 전용 빌드를 쓴다.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
