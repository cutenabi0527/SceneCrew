plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'
description = 'SceneCrew backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'jakarta.mail:jakarta.mail-api'
    implementation 'org.eclipse.angus:angus-mail'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // S3 파일 저장 (backend/docs/file-storage.md)
    implementation platform('software.amazon.awssdk:bom:2.31.0')
    implementation 'software.amazon.awssdk:s3'
    // 업로드한 PDF의 실제 쪽수 확인 (backend/docs/file-storage.md)
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    // 현장 이슈 영향 분석용 업무 관계 그래프 (backend/docs/impact-analysis.md)
    implementation 'org.neo4j.driver:neo4j-java-driver'
    implementation 'com.google.firebase:firebase-admin:9.11.0'
    // AI Python 3.12와 같은 Unicode 15.0의 전체 casefold(단순 소문자 변환과 다름).
    implementation 'com.ibm.icu:icu4j:73.2'
    compileOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
